<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Agent Lab · 企业智能体工程</title><style>
:root{--bg:#f5f6f8;--paper:#fff;--ink:#182431;--muted:#667382;--line:#dce2e8;--accent:#126e67;--soft:#e4f3ef;--code:#17232f;--codeink:#e5edf4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 system-ui,"Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer}a{color:var(--accent)}.shell{display:grid;grid-template-columns:310px minmax(0,1fr);min-height:100vh}.side{height:100vh;position:sticky;top:0;overflow:auto;background:var(--paper);border-right:1px solid var(--line);padding:24px 18px}.brand{font-weight:800;font-size:23px;letter-spacing:-.6px}.sub{font-size:12px;color:var(--muted)}.bar{height:6px;border-radius:8px;background:var(--line);overflow:hidden;margin:12px 0 3px}.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}.search{margin:18px 0;width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--bg);color:var(--ink)}details{border-bottom:1px solid var(--line);padding:8px 0}summary{font-size:14px;font-weight:650;cursor:pointer;list-style:none}summary:before{content:'›';display:inline-block;margin-right:8px;color:var(--muted)}details[open] summary:before{transform:rotate(90deg)}.lesson-link{display:block;text-align:left;width:100%;border:0;background:transparent;color:var(--muted);font-size:13px;padding:7px 10px 7px 20px;border-radius:6px;line-height:1.5}.lesson-link.active{background:var(--soft);color:var(--accent);font-weight:700}.lesson-link:hover{background:var(--bg)}.main{max-width:980px;width:100%;margin:auto;padding:36px 52px 80px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:13px}.tag{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:700}h1{font-size:clamp(28px,4vw,42px);line-height:1.25;letter-spacing:-1px;margin:18px 0}h2{font-size:21px;margin:32px 0 12px;line-height:1.4}p{margin:0 0 16px}.goal{border-left:3px solid var(--accent);padding:14px 18px;background:var(--soft);border-radius:0 9px 9px 0}.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);padding:18px;border-radius:10px}.node{padding:7px 11px;border:1px solid var(--line);border-radius:7px;font-size:13px;font-weight:600}.arr{color:var(--accent)}.codebox{position:relative;background:var(--code);border-radius:10px;overflow:hidden}.codehead{display:flex;justify-content:space-between;align-items:center;color:#b9c8d5;padding:9px 13px;border-bottom:1px solid #374552;font-size:12px}.codehead button{border:1px solid #526374;background:transparent;color:#e5edf4;border-radius:5px;padding:3px 10px;font-size:12px}pre{padding:18px;margin:0;overflow:auto;color:var(--codeink);font:13px/1.75 ui-monospace,Consolas,monospace;white-space:pre;tab-size:4}.panel{background:var(--paper);border:1px solid var(--line);padding:20px;border-radius:12px;margin:16px 0}.choice{display:block;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px 13px;margin:8px 0;border-radius:8px;width:100%;font-size:14px}.choice.correct{border-color:var(--accent);background:var(--soft);color:var(--accent)}.choice.wrong{border-color:#b95d4e;color:#b95d4e}.feedback{font-size:14px;margin-top:12px;min-height:24px}.nav{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;border-top:1px solid var(--line);padding-top:22px;margin-top:36px}.btn{border:1px solid var(--line);border-radius:8px;padding:9px 16px;background:var(--paper);color:var(--ink);font-size:14px}.primary{background:var(--accent);color:white;border-color:var(--accent)}.btn:disabled{opacity:.45;cursor:default}.mobile{display:none}.intro{color:var(--muted)}.refs{font-size:13px;color:var(--muted)}.refs a{display:inline-block;margin-right:15px}.notes{width:100%;min-height:100px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:12px;font:inherit;resize:vertical}.small{font-size:12px;color:var(--muted)}@media(prefers-color-scheme:dark){:root{--bg:#131b24;--paper:#1c2632;--ink:#e0e8ef;--muted:#a3b2c1;--line:#354352;--accent:#70d4c0;--soft:#203d3e}.primary{color:#10231f}}@media(max-width:760px){.shell{display:block}.side{position:fixed;z-index:10;inset:0 auto 0 0;width:min(310px,90vw);transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 30px #0003}.side.open{transform:none}.mobile{display:inline-block}.main{padding:22px 20px 50px}.top{flex-wrap:wrap}h2{margin-top:26px}} </style></head><body><div class="shell"><aside id="side" class="side"><div class="brand">Agent Lab<span style="color:var(--accent)">.</span></div><div class="sub">企业智能体工程 · V2 深化版</div><div class="bar"><i id="bar"></i></div><div id="progress" class="sub"></div><input class="search" id="search" type="search" placeholder="搜索课程、术语…"><nav id="menu"></nav><div class="small" style="margin-top:18px">进度和笔记保存在当前浏览器。<br><button class="btn" id="export" style="margin-top:8px">导出学习记录</button></div></aside><main class="main"><div class="top"><button class="btn mobile" id="toggle">☰ 目录</button><span id="crumb"></span><span id="position"></span></div><article id="lesson"></article><div class="nav"><button id="prev" class="btn">← 上一课</button><button id="complete" class="btn primary">标记完成</button><button id="next" class="btn">下一课 →</button></div></main></div><script src="course-part1.js"></script><script src="course-part2.js"></script><script src="solutions-part1.js"></script><script src="solutions-part2.js"></script><script src="course-advanced.js"></script><script>
(function(){
'use strict';
const units=[...window.COURSE_PART1,...window.COURSE_PART2,...window.COURSE_ADVANCED], lessons=units.flatMap(u=>u[2].map((l,i)=>({id:u[0]+'-'+(i+1),unit:u[0],module:u[1],data:l})));
const solutions={...window.COURSE_SOLUTIONS_1,...window.COURSE_SOLUTIONS_2,...window.COURSE_SOLUTIONS_ADVANCED};
const $=id=>document.getElementById(id);
const get=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}};
const store=(key,value)=>{try{localStorage.setItem(key,JSON.stringify(value))}catch{}};
let done=new Set(get('agentlab-done-v2',[])), notes=get('agentlab-notes-v2',{}), answers=get('agentlab-answers-v2',{}), current=0;
const refs={
'01':[['Hugging Face Agents Course','https://huggingface.co/learn/agents-course/en/unit0/introduction']],
'02':[['OpenAI Function Calling','https://platform.openai.com/docs/guides/function-calling']],
'03':[['Anthropic Agent 设计模式','https://www.anthropic.com/research/building-effective-agents']],
'04':[['MCP 2026-07-28 规范','https://modelcontextprotocol.io/specification/2026-07-28'],['MCP 2025-11-25 规范','https://modelcontextprotocol.io/specification/2025-11-25'],['Python SDK','https://github.com/modelcontextprotocol/python-sdk'],['HF MCP Course','https://huggingface.co/learn/mcp-course/en/unit0/introduction']],
'05':[['Anthropic Engineering','https://www.anthropic.com/engineering']],
'06':[['Hugging Face Agents Course','https://huggingface.co/learn/agents-course/en/unit0/introduction']],
'07':[['Anthropic Engineering','https://www.anthropic.com/engineering']],
'08':[['Building effective agents','https://www.anthropic.com/research/building-effective-agents']],
'09':[['MCP 规范','https://modelcontextprotocol.io/specification/']],
'10':[['Agents SDK','https://openai.github.io/openai-agents-python/'],['LangGraph','https://docs.langchain.com/oss/python/langgraph/overview'],['Spring AI','https://docs.spring.io/spring-ai/reference/']],
'11':[['Berkeley Function Calling Leaderboard','https://gorilla.cs.berkeley.edu/leaderboard.html']],
'12':[['Microsoft AI Agents','https://github.com/microsoft/ai-agents-for-beginners']], '13':[['Function Calling','https://platform.openai.com/docs/guides/function-calling']], '14':[['MCP official specification','https://modelcontextprotocol.io/specification/']], '15':[['LangGraph persistence','https://docs.langchain.com/oss/python/langgraph/persistence'],['Anthropic Engineering','https://www.anthropic.com/engineering']]
};
const el=(tag,cls,text)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x};
function updateProgress(){const count=lessons.filter(l=>done.has(l.id)).length;$('progress').textContent='已完成 '+count+' / '+lessons.length+' 节 · '+Math.round(100*count/lessons.length)+'%';$('bar').style.width=100*count/lessons.length+'%'}
function menu(){const query=$('search').value.trim().toLowerCase(), root=$('menu');root.replaceChildren();for(const u of units){const list=lessons.filter(l=>l.unit===u[0]&&(!query||JSON.stringify(l.data).toLowerCase().includes(query)||u[1].toLowerCase().includes(query)));if(!list.length)continue;const d=el('details');d.open=!!query||lessons[current].unit===u[0];d.append(el('summary','',u[0]+' · '+u[1]+' ('+lessons.filter(l=>l.unit===u[0]&&done.has(l.id)).length+'/'+u[2].length+')'));for(const l of list){const b=el('button','lesson-link'+(l.id===lessons[current].id?' active':''),(done.has(l.id)?'✓ ':'○ ')+l.id+'  '+l.data[0]);b.onclick=()=>go(lessons.indexOf(l));d.append(b)}root.append(d)}if(!root.children.length)root.append(el('p','small','没有匹配的课程。'))}
function section(root,title){root.append(el('h2','',title))}
function render(){const l=lessons[current], [title,goal,paragraphs,flow,code,lab,question,opts,correct,explanation,exercise]=l.data;const root=$('lesson');root.replaceChildren();$('crumb').textContent='模块 '+l.unit+' / '+l.module;$('position').textContent='第 '+(current+1)+' / '+lessons.length+' 课';root.append(el('div','tag','Lesson '+l.id),el('h1','',title),el('div','goal','本课目标：'+goal));section(root,'01 · 核心原理');for(const p of paragraphs)root.append(el('p','',p));section(root,'02 · 数据流');const f=el('div','flow');flow.split('→').forEach((s,i)=>{if(i)f.append(el('span','arr','→'));f.append(el('span','node',s.trim()))});root.append(f);section(root,'03 · 动手实验');const cb=el('div','codebox'), ch=el('div','codehead');ch.append(el('span','','代码示例 · '+(code.trim().startsWith('{')?'JSON / 协议':code.includes('public class')?'Java':'Python')));const copy=el('button','','复制代码');copy.onclick=async()=>{try{await navigator.clipboard.writeText(code);copy.textContent='已复制'}catch{copy.textContent='请手动选择复制'}};const dl=el('button','','保存代码');dl.onclick=()=>download(code,'lesson-'+l.id+(code.includes('public class')?'.java':code.trim().startsWith('{')?'.txt':'.py'),'text/plain');const buttons=el('div');buttons.append(copy,dl);ch.append(buttons);cb.append(ch,el('pre','',code));root.append(cb,el('p','',lab));section(root,'04 · 随堂测验');const panel=el('div','panel');panel.append(el('p','',question));const feedback=el('div','feedback');opts.forEach((o,i)=>{const b=el('button','choice',String.fromCharCode(65+i)+'. '+o);b.onclick=()=>{answers[l.id]=i;store('agentlab-answers-v2',answers);showAnswer()};panel.append(b)});panel.append(feedback);function showAnswer(){const a=answers[l.id];Array.from(panel.querySelectorAll('.choice')).forEach((b,i)=>{b.className='choice'+(a===i?(a===correct?' correct':' wrong'):'')});feedback.textContent=a===undefined?'选择一个答案，查看解析。':a===correct?'回答正确。'+explanation:'再想一想。'+explanation}showAnswer();root.append(panel);section(root,'05 · 课后实战');root.append(el('p','',exercise));const s=solutions[l.id];if(s){const d=el('details','panel');d.append(el('summary','','展开参考答案 · 解题过程 / 示例代码 / 验收标准'));d.append(el('h2','','解题思路'),el('p','',s[0]),el('h2','','关键流程'),el('p','',s[1]));const box=el('div','codebox'), head=el('div','codehead'), copySolution=el('button','','复制参考代码');copySolution.onclick=async()=>{try{await navigator.clipboard.writeText(s[2]);copySolution.textContent='已复制'}catch{copySolution.textContent='请手动复制'}};head.append(el('span','','参考实现 / 契约示例'),copySolution);box.append(head,el('pre','',s[2]));d.append(box,el('h2','','预期结果与排错'),el('p','',s[3]),el('h2','','验收标准'),el('p','',s[4]));root.append(d)}section(root,'06 · 我的学习笔记');const n=el('textarea','notes');n.placeholder='记录你的理解、运行结果、错误与问题…';n.value=notes[l.id]||'';n.oninput=()=>{notes[l.id]=n.value;store('agentlab-notes-v2',notes)};root.append(n,el('div','small','自动保存在本浏览器；可从目录底部导出。'));const ref=el('div','refs');ref.append(el('h2','','参考来源（选读）'));for(const [name,url] of refs[l.unit]||[]){const a=el('a','',name);a.href=url;a.target='_blank';a.rel='noopener noreferrer';ref.append(a)}root.append(ref);$('prev').disabled=current===0;$('next').disabled=current===lessons.length-1;$('complete').textContent=done.has(l.id)?'✓ 已完成 · 取消标记':'标记完成';menu();updateProgress()}
function go(i){if(i<0||i>=lessons.length)return;current=i;location.hash=lessons[i].id;render();$('side').classList.remove('open');window.scrollTo(0,0)}
function download(content,name,type){const a=el('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('complete').onclick=()=>{const id=lessons[current].id;if(done.has(id))done.delete(id);else done.add(id);store('agentlab-done-v2',[...done]);render()};$('toggle').onclick=()=>$('side').classList.toggle('open');$('search').oninput=menu;$('export').onclick=()=>download(JSON.stringify({completed:[...done],notes,answers},null,2),'agent-lab-progress.json','application/json');function fromHash(){const i=lessons.findIndex(l=>l.id===location.hash.slice(1));if(i>=0)current=i;render()}window.addEventListener('hashchange',()=>{fromHash();window.scrollTo(0,0)});fromHash();
})();
</script></body></html>
