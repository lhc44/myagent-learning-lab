<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>AI Agent 工程 · 从零开始的中文教材</title>
<style>
:root{color-scheme:light dark;--bg:#f4f5f7;--paper:#fff;--ink:#25313d;--muted:#657384;--line:#dfe4ea;--accent:#156c62;--soft:#e9f4f0;--code:#182531;--codeink:#e6edf4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.95 system-ui,"Microsoft YaHei",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}a{color:var(--accent)}.shell{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}.side{position:sticky;top:0;height:100vh;overflow:auto;padding:24px 18px;background:var(--paper);border-right:1px solid var(--line)}.brand{font-size:23px;font-weight:800;line-height:1.4}.sub{font-size:13px;color:var(--muted);line-height:1.6}.bar{height:6px;background:var(--line);border-radius:8px;overflow:hidden;margin:14px 0 5px}.bar i{display:block;height:100%;background:var(--accent)}.side nav{margin:20px 0}.chapter{display:block;width:100%;border:0;border-radius:7px;background:transparent;color:var(--ink);text-align:left;padding:10px 8px;font-size:14px;line-height:1.6;margin:3px 0}.chapter.active{color:var(--accent);background:var(--soft);font-weight:700}.chapter:hover{background:var(--soft)}.main{max-width:940px;width:100%;margin:auto;padding:36px 54px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:7px;padding:7px 13px;font-size:14px}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn:disabled{opacity:.45;cursor:default}h1{font-size:clamp(28px,4vw,39px);line-height:1.4;margin:24px 0 14px;letter-spacing:-.5px}h2{font-size:23px;line-height:1.5;margin:38px 0 16px}h3{font-size:18px;line-height:1.5;margin:22px 0 10px}p{margin:0 0 18px}.intro{font-size:18px;border-left:3px solid var(--accent);background:var(--soft);padding:16px 20px;border-radius:0 9px 9px 0}.panel{padding:20px;border:1px solid var(--line);background:var(--paper);border-radius:11px;margin:18px 0}.panel summary{cursor:pointer;font-weight:650;color:var(--accent)}.panel summary+p{margin-top:14px}.code{margin:16px 0;background:var(--code);color:var(--codeink);border-radius:9px;overflow:hidden}.codehead{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #435361;padding:8px 13px;font-size:12px;color:#c2ced8}.codehead button{font-size:12px;color:#e4edf4;background:transparent;border:1px solid #62717e;border-radius:4px;padding:3px 10px}pre{margin:0;padding:16px;overflow:auto;font:13px/1.8 ui-monospace,Consolas,monospace;white-space:pre}ol{padding-left:24px}li{margin:10px 0}.notes{width:100%;min-height:100px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:12px;resize:vertical}.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:24px;padding-top:22px;border-top:1px solid var(--line)}.mobile{display:none}.files{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.small{font-size:13px;color:var(--muted)}.toc{border-bottom:1px solid var(--line);padding:14px 0 20px}.toc a{display:block;font-size:14px;line-height:1.6;margin:5px 0}.tag{color:var(--accent);font-weight:650;letter-spacing:.04em;font-size:13px}.footer{font-size:13px;color:var(--muted);margin-top:32px}@media(prefers-color-scheme:dark){:root{--bg:#151e28;--paper:#1c2833;--ink:#e6edf4;--muted:#a6b3c1;--line:#374654;--accent:#70d4c0;--soft:#203c3c}.btn.primary{color:#122622}}@media(max-width:780px){.shell{display:block}.side{position:fixed;z-index:10;inset:0 auto 0 0;width:min(300px,90vw);transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 25px #0003}.side.open{transform:none}.mobile{display:inline-block}.main{padding:20px 20px 45px}body{font-size:16px}h2{font-size:21px}}
.course-links{display:grid;gap:8px;margin:18px 0 8px}.course-links a{font-size:14px;text-decoration:none;background:var(--soft);border-radius:7px;padding:7px 10px;font-weight:650}.download-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 0;font-size:14px}.download-row .btn{text-decoration:none}.code-note{font-size:13px;color:var(--muted);margin:8px 0 0}.reading-block{border-top:1px solid var(--line);padding-top:8px;margin-top:22px}.reading-block p{margin:12px 0}.reading-block pre{max-height:620px;overflow:auto}a.btn{display:inline-block;text-decoration:none}</style></head><body>
<div class="shell"><aside class="side" id="side"><div class="brand">AI Agent 工程教材</div><div class="sub">V4.2 · 面向开发者的 Agent 主线</div><div class="bar"><i id="bar"></i></div><div class="sub" id="progress"></div><nav class="course-links" aria-label="课程资源"><a href="start.html">课程说明与环境准备</a><a href="downloads.html">↓ 实验程序下载中心</a></nav><nav id="menu"></nav><button class="btn" id="export">导出本版学习笔记</button><p class="sub" style="margin-top:15px"><a href="reference.html">旧版 44 节选读资料（原进度仍保留）</a></p></aside><main class="main"><div class="top"><button class="btn mobile" id="toggle">☰ 目录</button><span id="position"></span><a class="btn primary" href="downloads.html" style="text-decoration:none">↓ 程序下载</a></div><article id="article"></article><div class="nav"><button class="btn" id="prev">← 上一章</button><button class="btn primary" id="complete">标记本章读完</button><button class="btn" id="next">下一章 →</button></div><div class="footer">阅读进度不等于技能认证。本教材使用虚构业务数据。真实模型请求可能收费；API 密钥仅在本地终端设置。现代 MCP 2.x 实验已编写，实际联调及生产级 Java 项目尚未完成。</div></main></div>
<script src="textbook.js"></script><script src="real-lab.js"></script><script src="textbook-labs.js"></script><script src="code-reading.js"></script>
<script>
(function(){
'use strict';
const chapters=window.TEXTBOOK, $=id=>document.getElementById(id);
const el=(tag,cls,text)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x};
function get(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
let done=new Set(get('agentlab-v4-read',[])),notes=get('agentlab-v4-notes',{}),current=0;
const files={'real_api_agent.py':window.REAL_LAB.agent,'test_real_api_agent.py':window.REAL_LAB.tests,'real_embedding.py':window.REAL_LAB.embedding,...window.TEXTBOOK_LABS};
function download(name,text){const a=el('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function codeBox(title,code){const b=el('div','code'),h=el('div','codehead'),copy=el('button','','复制');copy.onclick=async()=>{try{await navigator.clipboard.writeText(code);copy.textContent='已复制'}catch{copy.textContent='请手动复制'}};h.append(el('span','',title),copy);b.append(h,el('pre','',code));return b}
function chapterLinks(){
const group={0:"basic",1:"basic",2:"basic",3:"basic",4:"basic",5:"enterprise",6:"mcp",7:"retrieval",9:"evaluation"}[current];
const d=el("div","download-row");
const a=el("a","btn primary",group?"↓ 本章所需程序":"↓ 实验程序下载中心");a.href="downloads.html"+(group?"#"+group:"");
const b=el("a","btn","课程说明 / API 配置");b.href="start.html";
d.append(a,b);
const guide=window.CODE_READING[current+1];if(guide)d.append(el("span","small","本章文件："+guide.files.join(" · ")));
return d}
function codeReading(root){
const g=window.CODE_READING[current+1];if(!g)return;
root.append(el("h2","","本章程序怎么读"),el("p","",g.intro));
for(const block of g.blocks){
const area=el("div","reading-block");
area.append(el("h3","",block.title),el("p","code-note",block.file+" · 真实源码摘录"));
area.append(codeBox("Python 源码 · "+block.file,block.code));
for(const p of block.explain)area.append(el("p","",p));
root.append(area)}
root.append(el("p","small","以上是完整程序中的关键位置，不需要单独保存这些摘录。请使用本章下载的 .py 文件运行。"));
}
function menu(){const n=$('menu');n.replaceChildren();chapters.forEach((c,i)=>{const b=el('button','chapter'+(i===current?' active':''),(done.has(i)?'✓ ':'○ ')+c.title);b.onclick=()=>go(i);n.append(b)});$('progress').textContent='已读 '+done.size+' / '+chapters.length+' 章';$('bar').style.width=100*done.size/chapters.length+'%'}
function render(){const c=chapters[current],a=$('article');a.replaceChildren();$('position').textContent='第 '+(current+1)+' / '+chapters.length+' 章';a.append(el('div','tag','主线教程'),el('h1','',c.title),el('p','intro',c.intro),chapterLinks());const toc=el('div','toc');toc.append(el('div','small','本章阅读顺序'));c.sections.forEach((s,i)=>{const l=el('a','',s[0]);l.href='#chapter-'+(current+1)+'-section-'+(i+1);toc.append(l)});a.append(toc);c.sections.forEach((s,i)=>{const h=el('h2','',s[0]);h.id='chapter-'+(current+1)+'-section-'+(i+1);a.append(h);for(const p of s.slice(1))a.append(el('p','',p))});if(c.code)a.append(codeBox(c.code.language+' · '+c.code.title,c.code.text));if(c.workshop?.length){a.append(el('h2','','阅读实际协议与源码'));for(const w of c.workshop){a.append(el('h3','',w.title),codeBox('报文示意 / 源码摘录（完整程序见工具箱）',w.text));for(const line of w.explanation)a.append(el('p','',line))}}codeReading(a);const p=c.practice;a.append(el('h2','','跟着做：'+p.title));const list=el('ol');for(const s of p.steps)list.append(el('li','',s));a.append(list);if(p.command)a.append(codeBox('进入实验目录后，在终端依次执行',p.command));if(p.optionalCommand){const opt=el('details','panel');opt.append(el('summary','','选做：继续比较模型工具选择行为'),codeBox('选做命令',p.optionalCommand));a.append(opt)}const result=el('details','panel');result.append(el('summary','','做完后对照：应该观察到什么，为什么？'),el('p','',p.answer));a.append(result);a.append(el('h2','','我的实验记录（选填）'));const n=el('textarea','notes');n.placeholder='记录你真正运行了什么、看到了什么、还有哪里不懂。';n.value=notes[current]||'';n.oninput=()=>{notes[current]=n.value;save('agentlab-v4-notes',notes)};a.append(n,el('p','small','自动保存在当前浏览器；旧版笔记不会被覆盖。'));const r=el('details','panel');r.append(el('summary','','官方依据与进一步阅读'));for(const [t,u] of window.TEXTBOOK_REFERENCES){const l=el('a','',t);l.href=u;l.target='_blank';l.rel='noopener noreferrer';const p=el('p');p.append(l);r.append(p)}a.append(r);$('prev').disabled=current===0;$('next').disabled=current===chapters.length-1;$('complete').textContent=done.has(current)?'✓ 已读（点击取消）':'标记本章读完';menu()}
function go(i){if(i<0||i>=chapters.length)return;current=i;history.pushState(null,'','#chapter-'+(i+1));render();$('side').classList.remove('open');window.scrollTo(0,0)}
function sync(){const m=location.hash.match(/^#chapter-(\d+)(?:-section-(\d+))?$/);if(m){const i=Number(m[1])-1;if(i>=0&&i<chapters.length)current=i}render();if(m&&m[2]){const s=$(location.hash.slice(1));if(s)s.scrollIntoView()}else window.scrollTo(0,0)}
$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('complete').onclick=()=>{if(done.has(current))done.delete(current);else done.add(current);save('agentlab-v4-read',[...done]);$('complete').textContent=done.has(current)?'✓ 已读（点击取消）':'标记本章读完';menu()};$('toggle').onclick=()=>$('side').classList.toggle('open');$('export').onclick=()=>download('agentlab-v4-notes.json',JSON.stringify({read:[...done],notes},null,2));window.addEventListener('popstate',sync);window.addEventListener('hashchange',sync);sync();
})();
</script></body></html>
