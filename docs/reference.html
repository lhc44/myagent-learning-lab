return d}
function render(){const l=lessons[current], [title,goal,paragraphs,flow,code,lab,question,opts,correct,explanation,exercise]=l.data;const root=$('lesson');root.replaceChildren();$('crumb').textContent='模块 '+l.unit+' / '+l.module;$('position').textContent='第 '+(current+1)+' / '+lessons.length+' 课';root.append(el('div','tag','Lesson '+l.id),el('h1','',title),el('div','goal','本课目标：'+goal));section(root,'01 · 核心原理');for(const p of paragraphs)root.append(el('p','',p));section(root,'02 · 数据流');const f=el('div','flow');flow.split('→').forEach((s,i)=>{if(i)f.append(el('span','arr','→'));f.append(el('span','node',s.trim()))});root.append(f);section(root,'03 · 动手实验');const guidance=window.LEARNING_GUIDE[l.id];if(guidance){const info=el('div','goal');info.append(el('div','tag',guidance[0]),el('p','',guidance[1]));root.append(info)}if(['01-1','01-2','02-3','03-1','06-2','09-2','11-1','13-1'].includes(l.id))root.append(realPanel());const cb=el('div','codebox'), ch=el('div','codehead');ch.append(el('span','','代码示例 · '+(code.trim().startsWith('{')?'JSON / 协议':code.includes('public class')?'Java':'Python')));const copy=el('button','','复制代码');copy.onclick=async()=>{try{await navigator.clipboard.writeText(code);copy.textContent='已复制'}catch{copy.textContent='请手动选择复制'}};const dl=el('button','','保存代码');dl.onclick=()=>download(code,'lesson-'+l.id+(code.includes('public class')?'.java':code.trim().startsWith('{')?'.txt':'.py'),'text/plain');const buttons=el('div');buttons.append(copy,dl);ch.append(buttons);cb.append(ch,el('pre','',code));root.append(cb,el('p','',lab));if(guidance){root.append(el('h2','','学完这一段，你应该能做到什么'),el('p','',guidance[2]))}section(root,'04 · 随堂测验');const panel=el('div','panel');panel.append(el('p','',question));const feedback=el('div','feedback');opts.forEach((o,i)=>{const b=el('button','choice',String.fromCharCode(65+i)+'. '+o);b.onclick=()=>{answers[l.id]=i;store('agentlab-answers-v2',answers);showAnswer()};panel.append(b)});panel.append(feedback);function showAnswer(){const a=answers[l.id];Array.from(panel.querySelectorAll('.choice')).forEach((b,i)=>{b.className='choice'+(a===i?(a===correct?' correct':' wrong'):'')});feedback.textContent=a===undefined?'选择一个答案，查看解析。':a===correct?'回答正确。'+explanation:'再想一想。'+explanation}showAnswer();root.append(panel);section(root,'05 · 课后实战');root.append(el('p','',exercise));const s=solutions[l.id];if(s){const d=el('details','panel');d.append(el('summary','','做完后再看：参考答案与讲解'));d.append(el('h2','','解题思路'),el('p','',s[0]),el('h2','','把思路串起来'),el('p','',s[1]));const box=el('div','codebox'), head=el('div','codehead'), copySolution=el('button','','复制参考代码');copySolution.onclick=async()=>{try{await navigator.clipboard.writeText(s[2]);copySolution.textContent='已复制'}catch{copySolution.textContent='请手动复制'}};head.append(el('span','','参考实现 / 契约示例'),copySolution);box.append(head,el('pre','',s[2]));d.append(box,el('h2','','运行后应该看到什么？为什么？'),el('p','',s[3]),el('h2','','怎样判断自己真的学会了？'),el('p','',s[4]));root.append(d)}section(root,'06 · 我的学习笔记');const n=el('textarea','notes');n.placeholder='记录你的理解、运行结果、错误与问题…';n.value=notes[l.id]||'';n.oninput=()=>{notes[l.id]=n.value;store('agentlab-notes-v2',notes)};root.append(n,el('div','small','自动保存在本浏览器；可从目录底部导出。'));const ref=el('div','refs');ref.append(el('h2','','参考来源（选读）'));for(const [name,url] of refs[l.unit]||[]){const a=el('a','',name);a.href=url;a.target='_blank';a.rel='noopener noreferrer';ref.append(a)}root.append(ref);$('prev').disabled=current===0;$('next').disabled=current===lessons.length-1;$('complete').textContent=done.has(l.id)?'✓ 已完成 · 取消标记':'标记完成';menu();updateProgress()}
function go(i){if(i<0||i>=lessons.length)return;current=i;location.hash=lessons[i].id;render();$('side').classList.remove('open');window.scrollTo(0,0)}
function download(content,name,type){const a=el('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('apiStart').onclick=()=>{go(0);const p=$('realExperiment');if(p){p.open=true;p.scrollIntoView({behavior:'smooth'})}};$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('complete').onclick=()=>{const id=lessons[current].id;if(done.has(id))done.delete(id);else done.add(id);store('agentlab-done-v2',[...done]);render()};$('toggle').onclick=()=>$('side').classList.toggle('open');$('search').oninput=menu;$('export').onclick=()=>download(JSON.stringify({completed:[...done],notes,answers},null,2),'agent-lab-progress.json','application/json');function fromHash(){const i=lessons.findIndex(l=>l.id===location.hash.slice(1));if(i>=0)current=i;render()}window.addEventListener('hashchange',()=>{fromHash();window.scrollTo(0,0)});fromHash();
})();
</script></body></html>
